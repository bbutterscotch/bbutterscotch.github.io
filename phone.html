<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emily Root · Phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Placeholder until the phone home screen (Emily Phone design) is built. */
  :root { --bg: #0a0f24; --card: #121a38; --line: #1f2a52; --ink: #e8eefb; --muted: #99a5c6; --a1: oklch(0.84 0.14 190); --a1Ink: #041419; --a2: oklch(0.80 0.17 135); }
  :root[data-theme="light"] { --bg: oklch(0.93 0.035 230); --card: #fff; --line: #e2e7f3; --ink: #121a38; --muted: #5a6488; --a1: oklch(0.52 0.11 205); --a1Ink: #fff; --a2: oklch(0.50 0.14 145); }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 56px 24px 40px; box-sizing: border-box; min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }
  .rootmark { display: inline-flex; align-items: stretch; font: 700 34px/1 'Oxanium', sans-serif; color: var(--a1); align-self: flex-start; }
  .rootmark svg { width: .6em; height: auto; flex: none; display: block; overflow: visible; }
  .rootmark span { display: block; line-height: 1; padding: .12em .05em 0 .06em; border-top: .09em solid currentColor; letter-spacing: -.01em; }
  h1 { margin: 0; font-size: 22px; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 14.5px; }
  .status { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; margin-top: 10px; }
  .status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--a2); }
  .list { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .list a, .list button { all: unset; cursor: pointer; display: flex; justify-content: space-between; padding: 14px 16px; font-size: 15px; font-weight: 500; }
  .list > * + * { border-top: 1px solid var(--line) !important; }
  .list span { color: var(--muted); }
  .note { color: var(--muted); font-size: 12.5px; text-align: center; margin: 0; }
  .back { border: 0; cursor: pointer; align-self: center; background: var(--a1); color: var(--a1Ink); font: 600 14px 'IBM Plex Sans', sans-serif; padding: 10px 18px; border-radius: 99px; }
</style>
</head>
<body>
  <div>
    <span class="rootmark"><svg viewBox="0 0 60 121" preserveAspectRatio="none" aria-hidden="true"><path d="M2 56 L17 46 L32 86 L57 4.5 L61 4.5" fill="none" stroke="currentColor" stroke-width="9" stroke-linejoin="miter" stroke-linecap="butt"/></svg><span>Emily</span></span>
    <h1 style="margin-top:14px">Emily Root</h1>
    <p class="sub">Software engineer at BrightVine Solutions</p>
    <span class="status">Open to offers</span>
  </div>
  <nav class="list">
    <a href="https://bbutterscotch.itch.io" target="_blank" rel="noopener">Games on itch.io <span>↗</span></a>
    <a href="https://github.com/bbutterscotch" target="_blank" rel="noopener">GitHub <span>↗</span></a>
    <a href="https://www.linkedin.com/in/eeroot/" target="_blank" rel="noopener">LinkedIn <span>↗</span></a>
    <a href="img/resume_emilyroot.pdf" target="_blank">Resume (PDF) <span>↓</span></a>
  </nav>
  <p class="note">The phone version of the site is on its way.</p>
  <button class="back" id="back" type="button">⏏ Back to desk</button>
<script>
  const q = new URLSearchParams(location.search);
  const setTheme = (t) => { if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; };
  setTheme(q.get('theme'));
  addEventListener('message', (e) => { if (e.data && e.data.type === 'er-theme') setTheme(e.data.theme); });
  const exit = () => { if (parent !== window) parent.postMessage({ type: 'er-exit' }, '*'); else location.href = 'desk.html'; };
  document.getElementById('back').addEventListener('click', exit);
  addEventListener('keydown', (e) => { if (e.key === 'Escape') exit(); });
</script>
</body>
</html>
